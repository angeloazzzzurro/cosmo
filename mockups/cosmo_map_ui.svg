  <line x1="860" y1="86" x2="860" y2="606" stroke="#1a3060" stroke-width="1.5"/>

  <!-- Light curve panel -->
  <rect x="870" y="96" width="320" height="160" rx="4" fill="#050b18" stroke="#1a3060" stroke-width="1"/>
  <text x="880" y="112" font-family="monospace" font-size="11" fill="#7090b0">Light Curve — Kepler-442b</text>
  <text x="880" y="124" font-family="monospace" font-size="9" fill="#3a5a7a">Phase-folded · P = 112.3 days</text>

  <!-- Light curve axes -->
  <line x1="895" y1="225" x2="1175" y2="225" stroke="#1a3060" stroke-width="1"/>
  <line x1="895" y1="140" x2="895" y2="225" stroke="#1a3060" stroke-width="1"/>

  <!-- Light curve path - baseline and dip -->
  <polyline points="895,165 930,165 950,165 960,164 965,162 970,158 975,166 980,185 985,198 990,205 995,208 1000,208 1005,205 1010,198 1015,185 1020,166 1025,162 1030,158 1035,163 1040,165 1060,165 1080,165 1100,165 1120,165 1140,165 1160,165 1175,165"
    fill="none" stroke="#3a7aff" stroke-width="1.8"/>
  <!-- Noise scatter -->
  <polyline points="900,165 905,164 910,166 915,165 920,164 925,166 930,165 935,164 940,165 945,166 1045,165 1050,164 1055,166 1065,165 1070,164 1075,166 1085,165 1090,164 1095,165 1105,164 1110,166 1115,165 1120,164 1125,166 1130,165 1135,164 1140,165 1145,164 1150,166 1155,165 1160,164 1165,165 1170,164 1175,165"
    fill="none" stroke="#3a7aff" stroke-width="1" opacity="0.5"/>

  <!-- Transit annotation -->
  <line x1="997" y1="140" x2="997" y2="225" stroke="#ff9a3a" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.5"/>
  <text x="975" y="138" font-family="monospace" font-size="8" fill="#ff9a3a">transit</text>

  <!-- Y axis labels -->
  <text x="876" y="168" font-family="monospace" font-size="8" fill="#2a4060">1.000</text>
  <text x="876" y="210" font-family="monospace" font-size="8" fill="#2a4060">0.998</text>
  <text x="876" y="228" font-family="monospace" font-size="8" fill="#2a4060">−0.5</text>
  <text x="1095" y="228" font-family="monospace" font-size="8" fill="#2a4060">+0.5</text>
  <text x="976" y="228" font-family="monospace" font-size="8" fill="#2a4060">0.0</text>
  <text x="990" y="238" font-family="monospace" font-size="9" fill="#2a4060">Phase</text>

  <!-- AstroNet score panel -->
