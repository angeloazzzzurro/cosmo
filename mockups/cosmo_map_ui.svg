  <text x="880" y="284" font-family="monospace" font-size="11" fill="#7090b0">AstroNet Score</text>
  <text x="880" y="300" font-family="monospace" font-size="9" fill="#3a5a7a">Dual-stream CNN · Global + Local view</text>

  <!-- Score bar -->
  <rect x="880" y="312" width="280" height="14" rx="3" fill="#0d1a2e"/>
  <rect x="880" y="312" width="265" height="14" rx="3" fill="url(#scoreGrad)"/>
  <text x="1155" y="323" font-family="monospace" font-size="10" fill="#3affa0" font-weight="bold">0.947</text>

  <text x="880" y="342" font-family="monospace" font-size="10" fill="#3affa0" font-weight="bold">● CONFIRMED PLANET</text>
  <text x="880" y="357" font-family="monospace" font-size="9" fill="#4a7a9a">Threshold: 0.5 · Confidence: 94.7%</text>

  <!-- Planet info panel -->
  <rect x="870" y="380" width="320" height="130" rx="4" fill="#050b18" stroke="#1a3060" stroke-width="1"/>
  <text x="880" y="396" font-family="monospace" font-size="11" fill="#7090b0">Planet — Kepler-442b</text>

  <!-- Planet visual -->
  <circle cx="910" cy="440" r="18" fill="url(#planetGrad)"/>
  <circle cx="940" cy="440" r="5" fill="#152a50" opacity="0.5"/> <!-- shadow -->
  <!-- Star small -->
  <circle cx="870" cy="415" r="6" fill="#fff8e0" opacity="0.9"/>
  <circle cx="870" cy="415" r="10" fill="none" stroke="#fff8c0" stroke-width="0.8" opacity="0.3"/>

  <text x="940" y="415" font-family="monospace" font-size="10" fill="#8abacc">Orbital period: 112.3 days</text>
  <text x="940" y="429" font-family="monospace" font-size="10" fill="#8abacc">Radius: 1.34 R⊕</text>
  <text x="940" y="443" font-family="monospace" font-size="10" fill="#8abacc">Insolation: 0.70 S⊕</text>
  <text x="940" y="457" font-family="monospace" font-size="10" fill="#3affa0">Habitable zone: ✓</text>
  <text x="940" y="471" font-family="monospace" font-size="10" fill="#8abacc">ESI: 0.84</text>
  <text x="940" y="490" font-family="monospace" font-size="8" fill="#3a5a7a">Source: NASA Exoplanet Archive</text>

  <!-- Gradient defs -->
  <defs>
    <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a4aff;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#2a9aff;stop-opacity:1"/>
      <stop offset="95%" style="stop-color:#3affa0;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="planetGrad" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#4a90d0;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#1a4a80;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a1a40;stop-opacity:1"/>
    </radialGradient>
  </defs>

  <!-- Bottom status bar -->
  <rect y="606" width="1200" height="30" fill="#0a1428"/>
  <text x="20" y="625" font-family="monospace" font-size="10" fill="#3a5a7a">HYG v3.8 · Kepler DR25 · AstroNet (Shallue &amp; Vanderburg 2018)</text>
  <text x="600" y="625" font-family="monospace" font-size="10" fill="#3a5a7a" text-anchor="middle">Hover star → details · Click → light curve · Scroll → zoom</text>
  <text x="1180" y="625" font-family="monospace" font-size="10" fill="#3a5a7a" text-anchor="end">cosmo v0.1</text>

