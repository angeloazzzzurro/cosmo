  <circle cx="640" cy="370" r="1.4" fill="#ffeecc" opacity="0.65"/>
  <circle cx="700" cy="430" r="1.6" fill="#eef4ff" opacity="0.7"/>
  <circle cx="760" cy="340" r="1.3" fill="#ffeedd" opacity="0.65"/>
  <circle cx="810" cy="250" r="1.5" fill="#e8ecff" opacity="0.7"/>
  <circle cx="830" cy="480" r="1.2" fill="#fff8e8" opacity="0.65"/>
  <circle cx="70" cy="300" r="1.4" fill="#eef0ff" opacity="0.7"/>
  <circle cx="90" cy="400" r="1.3" fill="#ffe8d8" opacity="0.65"/>
  <circle cx="50" cy="160" r="1.5" fill="#e8eeff" opacity="0.7"/>
  <circle cx="250" cy="390" r="1.4" fill="#fff0e8" opacity="0.65"/>
  <circle cx="410" cy="450" r="1.3" fill="#dde8ff" opacity="0.7"/>
  <circle cx="560" cy="300" r="1.5" fill="#ffeedd" opacity="0.65"/>
  <circle cx="690" cy="190" r="1.4" fill="#e8f2ff" opacity="0.7"/>
  <circle cx="740" cy="480" r="1.3" fill="#ffeecc" opacity="0.65"/>

