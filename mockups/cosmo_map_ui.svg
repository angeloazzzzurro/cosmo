  <circle cx="500" cy="230" r="8" fill="none" stroke="#3a7aff" stroke-width="0.8" opacity="0.25"/>
  <circle cx="500" cy="230" r="5" fill="none" stroke="#3a7aff" stroke-width="0.8" opacity="0.4"/>
