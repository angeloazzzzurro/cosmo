  <circle cx="200" cy="430" r="6" fill="none" stroke="#3a7aff" stroke-width="0.8" opacity="0.3"/>
  <circle cx="200" cy="430" r="2.5" fill="#60aaff" opacity="0.85"/>

  <!-- Constellation lines (Orion-like) -->
  <line x1="195" y1="430" x2="220" y2="390" stroke="#1a3060" stroke-width="0.8" opacity="0.6"/>
  <line x1="220" y1="390" x2="240" y2="360" stroke="#1a3060" stroke-width="0.8" opacity="0.6"/>
  <line x1="240" y1="360" x2="260" y2="380" stroke="#1a3060" stroke-width="0.8" opacity="0.6"/>
  <line x1="240" y1="360" x2="220" y2="330" stroke="#1a3060" stroke-width="0.8" opacity="0.6"/>
  <line x1="220" y1="330" x2="200" y2="320" stroke="#1a3060" stroke-width="0.8" opacity="0.6"/>

  <!-- Hover tooltip (star detail) -->
  <rect x="520" y="160" width="220" height="120" rx="6" fill="#0d1f3a" stroke="#3a6aaa" stroke-width="1.5" opacity="0.97"/>
  <line x1="515" y1="210" x2="520" y2="210" stroke="#ff9a3a" stroke-width="1.2"/>
  <text x="530" y="180" font-family="monospace" font-size="12" fill="#ffcc80" font-weight="bold">Kepler-442</text>
  <text x="530" y="196" font-family="monospace" font-size="10" fill="#8aaacc">Type: K-dwarf (K5V)</text>
  <text x="530" y="210" font-family="monospace" font-size="10" fill="#8aaacc">Magnitude: 9.8</text>
  <text x="530" y="224" font-family="monospace" font-size="10" fill="#8aaacc">RA: 19h 01m  Dec: +39°</text>
  <text x="530" y="238" font-family="monospace" font-size="10" fill="#3affa0">● Confirmed planets: 1</text>
  <text x="530" y="252" font-family="monospace" font-size="10" fill="#60b0ff">KOI score: 0.947</text>
  <text x="530" y="268" font-family="monospace" font-size="9" fill="#4a6a8a" font-style="italic">Click → light curve</text>

  <!-- Kepler field box annotation -->
  <rect x="455" y="195" width="115" height="90" rx="4" fill="none" stroke="#3a7aff" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.4"/>
  <text x="458" y="193" font-family="monospace" font-size="9" fill="#3a7aff" opacity="0.7">Kepler field</text>

