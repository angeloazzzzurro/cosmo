  <circle cx="25" cy="578" r="7" fill="none" stroke="#3a7aff" stroke-width="0.8" opacity="0.5"/>
  <text x="36" y="582" font-family="monospace" font-size="9" fill="#7090b0">Confirmed (KOI score &gt; 0.9)</text>
  <circle cx="25" cy="594" r="3" fill="#ffb060"/>
  <circle cx="25" cy="594" r="6" fill="none" stroke="#ff9a3a" stroke-width="0.8" opacity="0.5"/>
  <text x="36" y="598" font-family="monospace" font-size="9" fill="#7090b0">Multi-planet system</text>
  <circle cx="145" cy="578" r="3" fill="#3affa0"/>
  <circle cx="145" cy="578" r="6" fill="none" stroke="#3affa0" stroke-width="0.8" opacity="0.5"/>
  <text x="155" y="582" font-family="monospace" font-size="9" fill="#7090b0">HZ planet</text>
  <circle cx="145" cy="594" r="2" fill="#aabbdd" opacity="0.6"/>
  <text x="155" y="598" font-family="monospace" font-size="9" fill="#7090b0">Background star</text>
