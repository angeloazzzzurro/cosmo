  <circle cx="160" cy="350" r="1.4" fill="#fff5e0" opacity="0.7"/>
  <circle cx="220" cy="290" r="1.6" fill="#e0e8ff" opacity="0.65"/>
  <circle cx="310" cy="460" r="1.3" fill="#ffe8d0" opacity="0.7"/>
  <circle cx="365" cy="320" r="1.5" fill="#f0f0ff" opacity="0.65"/>
