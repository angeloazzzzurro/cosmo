  <circle cx="100" cy="140" r="0.8" fill="#aabbdd" opacity="0.5"/>
  <circle cx="175" cy="250" r="0.9" fill="#bbccee" opacity="0.5"/>
  <circle cx="260" cy="130" r="0.8" fill="#aabbdd" opacity="0.45"/>
  <circle cx="330" cy="220" r="0.9" fill="#ccddee" opacity="0.5"/>
  <circle cx="395" cy="270" r="0.8" fill="#aab8cc" opacity="0.45"/>
  <circle cx="470" cy="120" r="0.9" fill="#bbccdd" opacity="0.5"/>
  <circle cx="505" cy="340" r="0.8" fill="#aabbcc" opacity="0.45"/>
  <circle cx="575" cy="480" r="0.9" fill="#ccd8ee" opacity="0.5"/>
  <circle cx="625" cy="290" r="0.8" fill="#aabbdd" opacity="0.45"/>
  <circle cx="680" cy="530" r="0.9" fill="#bbccee" opacity="0.5"/>
  <circle cx="730" cy="140" r="0.8" fill="#aac0dd" opacity="0.45"/>
  <circle cx="790" cy="400" r="0.9" fill="#bbccdd" opacity="0.5"/>
  <circle cx="840" cy="160" r="0.8" fill="#aabbcc" opacity="0.45"/>
  <circle cx="40" cy="230" r="0.9" fill="#bbccee" opacity="0.5"/>
  <circle cx="140" cy="510" r="0.8" fill="#aabbdd" opacity="0.45"/>
  <circle cx="200" cy="545" r="0.9" fill="#ccd8ee" opacity="0.5"/>
  <circle cx="320" cy="550" r="0.8" fill="#aabbdd" opacity="0.45"/>
  <circle cx="440" cy="550" r="0.9" fill="#bbccee" opacity="0.5"/>
  <circle cx="600" cy="140" r="0.8" fill="#aac0dd" opacity="0.45"/>
  <circle cx="770" cy="570" r="0.9" fill="#bbccdd" opacity="0.5"/>

