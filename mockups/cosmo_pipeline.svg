    <marker id="arrowDown" markerWidth="8" markerHeight="8" refX="3" refY="6" orient="auto">
      <path d="M0,0 L6,0 L3,8 z" fill="#2a5080"/>
    </marker>
    <linearGradient id="scoreGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a4aff"/>
      <stop offset="70%" style="stop-color:#2a9aff"/>
      <stop offset="100%" style="stop-color:#3affa0"/>
    </linearGradient>
  </defs>

  <!-- Bottom bar -->
  <rect y="500" width="1100" height="20" fill="#0a1428"/>
  <text x="550" y="514" font-family="monospace" font-size="9" fill="#2a4060" text-anchor="middle">
    Conv1D blocks · MaxPool1d · ReLU · Dropout 0.5 · Sigmoid — PyTorch · Apple Silicon MPS
  </text>
</svg>
