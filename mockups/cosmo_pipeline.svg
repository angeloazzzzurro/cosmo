  <text x="590" y="357" font-family="monospace" font-size="8" fill="#2a5a8a" text-anchor="middle">overlay</text>

  <!-- Defs -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2a5080"/>
