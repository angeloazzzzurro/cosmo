<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520">
  <rect width="1100" height="520" fill="#060d1e"/>

  <!-- Title -->
  <text x="550" y="36" font-family="monospace" font-size="16" fill="#a0c4ff" font-weight="bold" text-anchor="middle">COSMO — AstroNet Pipeline</text>
  <text x="550" y="54" font-family="monospace" font-size="11" fill="#4a6fa0" text-anchor="middle">Kepler/TESS Light Curve → Phase Fold → Dual-stream CNN → Exoplanet Score</text>

  <!-- ── Step 1: Raw light curve ── -->
  <rect x="20" y="80" width="180" height="120" rx="6" fill="#090f20" stroke="#1e3a60" stroke-width="1.5"/>
  <text x="110" y="98" font-family="monospace" font-size="10" fill="#6090b0" text-anchor="middle">Raw Light Curve</text>
  <text x="110" y="110" font-family="monospace" font-size="8" fill="#2a4060" text-anchor="middle">Kepler .fits · 90 days</text>
  <!-- Mini raw curve -->
  <polyline points="30,155 40,154 50,155 60,153 70,155 80,154 90,156 100,115 110,112 120,115 130,155 140,154 150,155 160,154 170,155 180,155 190,154"
    fill="none" stroke="#3a6aaa" stroke-width="1.5"/>
  <!-- transit dip label -->
  <line x1="110" y1="115" x2="110" y2="188" stroke="#ff9a3a" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.6"/>
  <text x="112" y="186" font-family="monospace" font-size="8" fill="#ff9a3a">transit</text>
  <!-- axis -->
  <line x1="28" y1="160" x2="192" y2="160" stroke="#1a3060" stroke-width="0.8"/>
  <text x="110" y="193" font-family="monospace" font-size="8" fill="#2a4060" text-anchor="middle">Time (BJD)</text>

  <!-- Arrow 1 -->
  <line x1="200" y1="140" x2="228" y2="140" stroke="#2a5080" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="214" y="132" font-family="monospace" font-size="8" fill="#2a5a8a" text-anchor="middle">BLS</text>
  <text x="214" y="154" font-family="monospace" font-size="8" fill="#2a5a8a" text-anchor="middle">period</text>

  <!-- ── Step 2: Phase fold ── -->
  <rect x="230" y="80" width="180" height="120" rx="6" fill="#090f20" stroke="#1e3a60" stroke-width="1.5"/>
  <text x="320" y="98" font-family="monospace" font-size="10" fill="#6090b0" text-anchor="middle">Phase Folding</text>
  <text x="320" y="110" font-family="monospace" font-size="8" fill="#2a4060" text-anchor="middle">fold.py · P = 112.3 d</text>
  <!-- Phase folded curve with transit dip -->
  <polyline points="240,155 255,155 265,155 270,154 275,152 280,148 285,144 290,140 295,148 300,152 305,154 315,155 325,155 335,154 340,155 345,155 350,154 355,155 360,155 365,154 370,155 375,155 380,154 385,155 395,155 400,154"
    fill="none" stroke="#3a7aff" stroke-width="1.5"/>
  <!-- noise -->
  <polyline points="242,155 247,154 252,156 257,155 262,154 267,155 307,155 312,154 317,155 330,154 337,155 342,154 352,155 357,154 362,155 367,154 372,155 377,154 382,155 387,154 392,155 397,154"
    fill="none" stroke="#3a7aff" stroke-width="0.8" opacity="0.4"/>
  <line x1="318" y1="115" x2="318" y2="175" stroke="#ff9a3a" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.5"/>
  <line x1="240" y1="158" x2="400" y2="158" stroke="#1a3060" stroke-width="0.8"/>
  <text x="240" y="192" font-family="monospace" font-size="8" fill="#2a4060">−0.5</text>
  <text x="311" y="192" font-family="monospace" font-size="8" fill="#2a4060">0</text>
  <text x="385" y="192" font-family="monospace" font-size="8" fill="#2a4060">+0.5</text>
  <text x="320" y="200" font-family="monospace" font-size="8" fill="#2a4060" text-anchor="middle">Phase</text>

  <!-- Arrow 2 -->
  <line x1="410" y1="140" x2="438" y2="140" stroke="#2a5080" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="424" y="132" font-family="monospace" font-size="8" fill="#2a5a8a" text-anchor="middle">split</text>
  <text x="424" y="154" font-family="monospace" font-size="8" fill="#2a5a8a" text-anchor="middle">views</text>

  <!-- ── Step 3: Two views ── -->
  <!-- Global view box -->
  <rect x="440" y="80" width="130" height="55" rx="5" fill="#090f20" stroke="#1a3580" stroke-width="1.2"/>
  <text x="505" y="97" font-family="monospace" font-size="9" fill="#5080b0" text-anchor="middle">Global View</text>
  <text x="505" y="109" font-family="monospace" font-size="8" fill="#2a4060" text-anchor="middle">2001 timesteps</text>
  <!-- mini global view -->
  <polyline points="448,126 462,126 470,125 476,123 480,120 485,126 492,126 510,126 520,126 525,125 530,126 540,126 560,126"
    fill="none" stroke="#3a6aaa" stroke-width="1.2"/>
  <line x1="448" y1="128" x2="562" y2="128" stroke="#1a3060" stroke-width="0.7"/>

  <!-- Local view box -->
  <rect x="440" y="145" width="130" height="55" rx="5" fill="#090f20" stroke="#1a3580" stroke-width="1.2"/>
  <text x="505" y="162" font-family="monospace" font-size="9" fill="#5080b0" text-anchor="middle">Local View</text>
  <text x="505" y="174" font-family="monospace" font-size="8" fill="#2a4060" text-anchor="middle">201 timesteps</text>
  <!-- mini local view with transit -->
  <polyline points="448,186 462,186 470,185 473,183 476,179 480,174 484,169 488,173 492,179 496,184 500,186 515,186 530,186 545,186 560,186"
    fill="none" stroke="#3a7aff" stroke-width="1.2"/>
  <line x1="448" y1="190" x2="562" y2="190" stroke="#1a3060" stroke-width="0.7"/>

  <!-- Arrow 3 -->
  <line x1="570" y1="140" x2="598" y2="140" stroke="#2a5080" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Step 4: CNN Architecture ── -->
  <rect x="600" y="70" width="270" height="175" rx="6" fill="#090f20" stroke="#1e3a60" stroke-width="1.5"/>
  <text x="735" y="88" font-family="monospace" font-size="10" fill="#6090b0" text-anchor="middle">AstroNet — Dual-stream CNN</text>

  <!-- Global stream -->
  <rect x="610" y="96" width="100" height="16" rx="3" fill="#0f1e3a" stroke="#2a4a8a" stroke-width="1"/>
  <text x="660" y="108" font-family="monospace" font-size="8" fill="#4a70a0" text-anchor="middle">GlobalStream</text>
  <!-- conv blocks global -->
  <rect x="610" y="117" width="14" height="30" rx="2" fill="#1a3a6a"/>
  <rect x="627" y="117" width="14" height="30" rx="2" fill="#1e4270"/>
  <rect x="644" y="117" width="14" height="30" rx="2" fill="#224a78"/>
  <rect x="661" y="117" width="14" height="30" rx="2" fill="#265282"/>
  <rect x="678" y="117" width="14" height="30" rx="2" fill="#2a5a8a"/>
  <!-- labels -->
  <text x="617" y="155" font-family="monospace" font-size="7" fill="#2a4060" text-anchor="middle">16</text>
  <text x="634" y="155" font-family="monospace" font-size="7" fill="#2a4060" text-anchor="middle">32</text>
  <text x="651" y="155" font-family="monospace" font-size="7" fill="#2a4060" text-anchor="middle">64</text>
  <text x="668" y="155" font-family="monospace" font-size="7" fill="#2a4060" text-anchor="middle">128</text>
  <text x="685" y="155" font-family="monospace" font-size="7" fill="#2a4060" text-anchor="middle">256</text>
  <text x="617" y="163" font-family="monospace" font-size="7" fill="#1a3060" text-anchor="middle">ch</text>
  <text x="634" y="163" font-family="monospace" font-size="7" fill="#1a3060" text-anchor="middle">ch</text>
  <text x="651" y="163" font-family="monospace" font-size="7" fill="#1a3060" text-anchor="middle">ch</text>
  <text x="668" y="163" font-family="monospace" font-size="7" fill="#1a3060" text-anchor="middle">ch</text>
  <text x="685" y="163" font-family="monospace" font-size="7" fill="#1a3060" text-anchor="middle">ch</text>
  <line x1="692" y1="131" x2="704" y2="131" stroke="#2a4a7a" stroke-width="0.8"/>
  <text x="698" y="129" font-family="monospace" font-size="7" fill="#2a4060">→</text>
  <rect x="700" y="120" width="28" height="22" rx="2" fill="#0d1a30" stroke="#2a4060" stroke-width="0.8"/>
  <text x="714" y="133" font-family="monospace" font-size="7" fill="#3a6080" text-anchor="middle">flat</text>

  <!-- Local stream -->
  <rect x="610" y="168" width="100" height="16" rx="3" fill="#0f1e3a" stroke="#2a4a8a" stroke-width="1"/>
  <text x="660" y="180" font-family="monospace" font-size="8" fill="#4a70a0" text-anchor="middle">LocalStream</text>
  <!-- conv blocks local -->
  <rect x="610" y="189" width="18" height="22" rx="2" fill="#1a3a6a"/>
  <rect x="631" y="189" width="18" height="22" rx="2" fill="#1e4270"/>
  <line x1="649" y1="200" x2="700" y2="200" stroke="#2a4a7a" stroke-width="0.8"/>
  <text x="660" y="198" font-family="monospace" font-size="7" fill="#2a4060">→ flatten</text>
  <rect x="700" y="189" width="28" height="22" rx="2" fill="#0d1a30" stroke="#2a4060" stroke-width="0.8"/>
  <text x="714" y="202" font-family="monospace" font-size="7" fill="#3a6080" text-anchor="middle">flat</text>
  <text x="619" y="218" font-family="monospace" font-size="7" fill="#2a4060" text-anchor="middle">16ch</text>
  <text x="640" y="218" font-family="monospace" font-size="7" fill="#2a4060" text-anchor="middle">32ch</text>

  <!-- Concat -->
  <line x1="728" y1="131" x2="745" y2="165" stroke="#2a5080" stroke-width="0.8"/>
  <line x1="728" y1="200" x2="745" y2="175" stroke="#2a5080" stroke-width="0.8"/>
  <rect x="743" y="158" width="30" height="22" rx="3" fill="#0d1e3a" stroke="#3a5a8a" stroke-width="1.2"/>
  <text x="758" y="173" font-family="monospace" font-size="8" fill="#4a7aaa" text-anchor="middle">cat</text>

  <!-- FC layers -->
  <line x1="773" y1="169" x2="790" y2="169" stroke="#2a5080" stroke-width="0.8"/>
  <rect x="788" y="148" width="20" height="42" rx="2" fill="#142a50" stroke="#2a4a80" stroke-width="0.8"/>
  <rect x="810" y="148" width="20" height="42" rx="2" fill="#162c52" stroke="#2a4a80" stroke-width="0.8"/>
  <rect x="832" y="148" width="20" height="42" rx="2" fill="#182e56" stroke="#2a4a80" stroke-width="0.8"/>
  <rect x="854" y="148" width="20" height="42" rx="2" fill="#1a3058" stroke="#2a4a80" stroke-width="0.8"/>
  <text x="798" y="200" font-family="monospace" font-size="7" fill="#2a4060" text-anchor="middle">512</text>
  <text x="820" y="200" font-family="monospace" font-size="7" fill="#2a4060" text-anchor="middle">512</text>
  <text x="842" y="200" font-family="monospace" font-size="7" fill="#2a4060" text-anchor="middle">512</text>
  <text x="864" y="200" font-family="monospace" font-size="7" fill="#2a4060" text-anchor="middle">512</text>
  <text x="826" y="207" font-family="monospace" font-size="7" fill="#1a3060" text-anchor="middle">4 × Dense + Dropout(0.5)</text>

  <!-- Output -->
  <line x1="874" y1="169" x2="890" y2="169" stroke="#2a5080" stroke-width="0.8"/>
  <circle cx="900" cy="169" r="12" fill="#0d1e3a" stroke="#3affa0" stroke-width="1.5"/>
  <text x="900" y="173" font-family="monospace" font-size="8" fill="#3affa0" text-anchor="middle">σ</text>

  <!-- Arrow 4 -->
  <line x1="870" y1="220" x2="870" y2="248" stroke="#2a5080" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- ── Step 5: Output / Score ── -->
  <rect x="600" y="280" width="270" height="110" rx="6" fill="#090f20" stroke="#1e3a60" stroke-width="1.5"/>
  <text x="735" y="298" font-family="monospace" font-size="10" fill="#6090b0" text-anchor="middle">Classification Score</text>

  <!-- Score bars -->
  <text x="615" y="318" font-family="monospace" font-size="9" fill="#4a7090">Confirmed</text>
  <rect x="680" y="308" width="140" height="12" rx="2" fill="#0d1a2e"/>
  <rect x="680" y="308" width="133" height="12" rx="2" fill="url(#scoreGrad2)"/>
  <text x="824" y="318" font-family="monospace" font-size="9" fill="#3affa0" font-weight="bold">0.947</text>

  <text x="615" y="338" font-family="monospace" font-size="9" fill="#4a7090">Candidate</text>
  <rect x="680" y="328" width="140" height="12" rx="2" fill="#0d1a2e"/>
  <rect x="680" y="328" width="80" height="12" rx="2" fill="#2a5a90"/>
  <text x="824" y="338" font-family="monospace" font-size="9" fill="#6090b0">0.571</text>

  <text x="615" y="358" font-family="monospace" font-size="9" fill="#4a7090">False pos.</text>
  <rect x="680" y="348" width="140" height="12" rx="2" fill="#0d1a2e"/>
  <rect x="680" y="348" width="20" height="12" rx="2" fill="#3a2a50"/>
  <text x="824" y="358" font-family="monospace" font-size="9" fill="#5a4070">0.142</text>

  <!-- Threshold line -->
  <line x1="714" y1="306" x2="714" y2="363" stroke="#ff9a3a" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.7"/>
  <text x="707" y="373" font-family="monospace" font-size="8" fill="#ff9a3a">thr=0.5</text>

  <text x="615" y="382" font-family="monospace" font-size="8" fill="#2a4060">Sigmoid output → score ∈ [0, 1]</text>

  <!-- ── Step 6: Map overlay ── -->
  <rect x="20" y="280" width="550" height="210" rx="6" fill="#090f20" stroke="#1e3a60" stroke-width="1.5"/>
  <text x="295" y="298" font-family="monospace" font-size="10" fill="#6090b0" text-anchor="middle">Sky Map Output — HYG × KOI Cross-match</text>

  <!-- Mini sky map -->
  <rect x="30" y="305" width="530" height="170" rx="3" fill="#060c1a"/>
  <!-- Grid -->
  <line x1="30" y1="390" x2="560" y2="390" stroke="#0d1a2e" stroke-width="0.7"/>
  <line x1="295" y1="305" x2="295" y2="475" stroke="#0d1a2e" stroke-width="0.7"/>
  <!-- Stars scatter -->
  <circle cx="80" cy="340" r="1.2" fill="#ccddee" opacity="0.6"/>
  <circle cx="130" cy="360" r="1.4" fill="#ddeeff" opacity="0.65"/>
  <circle cx="175" cy="330" r="1.0" fill="#bbccdd" opacity="0.5"/>
  <circle cx="220" cy="370" r="1.3" fill="#ccddf0" opacity="0.6"/>
  <circle cx="260" cy="350" r="1.5" fill="#ddeeff" opacity="0.7"/>
  <circle cx="310" cy="340" r="1.1" fill="#ccddee" opacity="0.6"/>
  <circle cx="350" cy="365" r="1.3" fill="#bbccdd" opacity="0.55"/>
  <circle cx="400" cy="345" r="1.2" fill="#ccddf0" opacity="0.6"/>
  <circle cx="450" cy="360" r="1.4" fill="#ddeeff" opacity="0.65"/>
  <circle cx="500" cy="335" r="1.0" fill="#ccddee" opacity="0.55"/>
  <circle cx="60" cy="420" r="1.1" fill="#bbccdd" opacity="0.5"/>
  <circle cx="110" cy="430" r="1.3" fill="#ccddf0" opacity="0.6"/>
  <circle cx="160" cy="410" r="1.2" fill="#ddeeff" opacity="0.65"/>
  <circle cx="210" cy="440" r="1.0" fill="#ccddee" opacity="0.55"/>
  <circle cx="340" cy="425" r="1.4" fill="#bbccdd" opacity="0.6"/>
  <circle cx="390" cy="415" r="1.2" fill="#ccddf0" opacity="0.6"/>
  <circle cx="440" cy="435" r="1.1" fill="#ddeeff" opacity="0.55"/>
  <circle cx="490" cy="420" r="1.3" fill="#ccddee" opacity="0.6"/>
  <circle cx="540" cy="410" r="1.0" fill="#bbccdd" opacity="0.5"/>
  <!-- KOI field -->
  <circle cx="295" cy="345" r="35" fill="none" stroke="#3a6aaa" stroke-width="0.7" stroke-dasharray="3,2" opacity="0.5"/>
  <text x="295" y="313" font-family="monospace" font-size="8" fill="#3a6aaa" text-anchor="middle" opacity="0.7">Kepler FOV</text>
  <!-- Exoplanet hosts -->
  <circle cx="290" cy="340" r="5" fill="none" stroke="#3a7aff" stroke-width="0.8" opacity="0.4"/>
  <circle cx="290" cy="340" r="2.2" fill="#60aaff" opacity="0.9"/>
  <circle cx="305" cy="352" r="4" fill="none" stroke="#3a7aff" stroke-width="0.7" opacity="0.35"/>
  <circle cx="305" cy="352" r="1.8" fill="#60aaff" opacity="0.85"/>
  <circle cx="278" cy="355" r="5" fill="none" stroke="#ff9a3a" stroke-width="0.8" opacity="0.4"/>
  <circle cx="278" cy="355" r="2" fill="#ffb060" opacity="0.9"/>
  <circle cx="315" cy="338" r="4" fill="none" stroke="#3affa0" stroke-width="0.7" opacity="0.35"/>
  <circle cx="315" cy="338" r="1.8" fill="#3affa0" opacity="0.85"/>
  <circle cx="300" cy="363" r="3.5" fill="none" stroke="#3a7aff" stroke-width="0.7" opacity="0.3"/>
  <circle cx="300" cy="363" r="1.5" fill="#60aaff" opacity="0.8"/>
  <!-- constellation lines -->
  <line x1="80" y1="340" x2="130" y2="360" stroke="#1a3060" stroke-width="0.7" opacity="0.5"/>
  <line x1="130" y1="360" x2="175" y2="330" stroke="#1a3060" stroke-width="0.7" opacity="0.5"/>
  <line x1="400" y1="345" x2="450" y2="360" stroke="#1a3060" stroke-width="0.7" opacity="0.5"/>
  <line x1="450" y1="360" x2="500" y2="335" stroke="#1a3060" stroke-width="0.7" opacity="0.5"/>

  <!-- Legend mini -->
  <circle cx="42" cy="460" r="3" fill="#60aaff"/>
  <text x="50" y="463" font-family="monospace" font-size="8" fill="#5a8090">KOI confirmed</text>
  <circle cx="130" cy="460" r="3" fill="#ffb060"/>
  <text x="138" y="463" font-family="monospace" font-size="8" fill="#5a8090">Multi-planet</text>
  <circle cx="210" cy="460" r="3" fill="#3affa0"/>
  <text x="218" y="463" font-family="monospace" font-size="8" fill="#5a8090">HZ candidate</text>

  <!-- RA/Dec labels -->
